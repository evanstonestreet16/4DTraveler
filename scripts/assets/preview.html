<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pittsburgh 1892 — asset review</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e5e1d6;
        color: #293a34;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        position: absolute;
        z-index: 1;
        top: 24px;
        left: 30px;
        right: 30px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: start;
        pointer-events: none;
      }
      h1 {
        font:
          32px Georgia,
          serif;
        margin: 8px 0;
      }
      p {
        margin: 0;
        opacity: 0.7;
      }
      select {
        padding: 10px;
        border: 1px solid #b6baaa;
        border-radius: 8px;
        background: #faf8ee;
        color: inherit;
        pointer-events: auto;
      }
      footer {
        position: absolute;
        bottom: 20px;
        left: 30px;
        right: 30px;
        font-size: 12px;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p>4DTRAVELER / OFFLINE ASSET REVIEW</p>
        <h1>Pittsburgh, 1892</h1>
        <p>Illustrative industrial composite</p>
      </div>
      <select aria-label="Camera">
        <option value="overview">Overview</option>
        <option value="steel-mill">Steel Mill</option>
        <option value="downtown">Downtown</option>
        <option value="river-bridge">River / Bridge</option>
      </select>
    </header>
    <canvas></canvas>
    <footer>Checking GLB…</footer>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
